name: Vérifications
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-enseignement
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: vscode-enseignement
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mpi-informatique/enseignement
          ref: 47a63d95f5ba916c88fbf495d7e7b957f611ca18
          path: enseignement
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop path:. -c npm ci
      - run: nix develop path:. -c npm test
      - run: nix develop path:. -c npm run package
